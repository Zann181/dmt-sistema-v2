# Producción en VPS: app Next.js + Postgres + Caddy (HTTPS automático) + backups diarios.
# Uso en el servidor:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: dmt

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmt
      POSTGRES_USER: dmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmt -d dmt"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base solo es accesible dentro de la red de Docker

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
        NEXT_PUBLIC_MEDIA_BASE_URL: https://${DOMAIN}
        NEXT_PUBLIC_TIMEZONE: ${NEXT_PUBLIC_TIMEZONE:-America/Bogota}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://dmt:${POSTGRES_PASSWORD}@db:5432/dmt?sslmode=disable
      DB_POOL_MAX: "10"
      AUTH_URL: https://${DOMAIN}
      NEXTAUTH_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_MEDIA_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/dmt-$$(date +%Y-%m-%d_%H%M).sql.gz
          pg_dump -h db -U dmt -d dmt --no-owner | gzip > "$$f" && echo "backup ok: $$f"
          find /backups -name 'dmt-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
